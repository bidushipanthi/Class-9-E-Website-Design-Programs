<!DOCTYPE html>
<html>
<head>
	<title>Basic Addition w User Input</title>
</head>
<body>
<script>
	var a=parseInt(prompt("Enter your first number: "))
	var b=parseInt(prompt("Enter your second number: ")_
	let sum=a+b
	var difference=a-b
	let quotient=a*b
	var product=a/b
	document.write("The sum of "+a+" and "+b+" is "+sum+"<br>")
	document.write("The difference of "+a+" and "+b+" is "+difference+"<br>")
	document.write("The quotient of "+a+" and "+b+" is "+quotient+"<br>")
	document.write("The product of "+a+" and "+b+" is "+product+"<br>")
</script>
</body>
</html>
